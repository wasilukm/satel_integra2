[tox]
isolated_build = true
envlist = py310, py311, py312, py313, lint

[testenv:lint]
extras =
    test
commands=flake8 satel_integra2

[testenv]
allowlist_externals = pytest
extras =
    test
setenv =
    PYTHONPATH = {toxinidir}
commands =
    pytest --cov=satel_integra2 --cov-branch --cov-report=xml --cov-report=term-missing tests

[gh-actions]
python =
    3.13: py313, lint
    3.12: py312
    3.11: py311
    3.10: py310
